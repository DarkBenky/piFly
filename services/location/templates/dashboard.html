<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>piFly — 3D Position</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0e0e13; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #scene { position: fixed; inset: 0; }
  .hud { position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(20,20,26,.85); border: 1px solid #2a2a33; border-radius: 10px;
    padding: 12px 14px; color: #ccc; min-width: 210px; }
  .hud h1 { font-size: .95rem; margin: 0 0 8px; color: #eee; letter-spacing: .3px; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: .82rem; margin: 3px 0; }
  .row .lbl { color: #777; }
  .row .val { color: #fff; font-variant-numeric: tabular-nums; }
  .status { position: fixed; top: 12px; right: 12px; z-index: 10; display: flex; gap: 6px;
    align-items: center; background: rgba(20,20,26,.85); border: 1px solid #2a2a33;
    border-radius: 10px; padding: 8px 12px; font-size: .78rem; color: #aaa; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #e55; }
  .dot.on { background: #5fd6a8; box-shadow: 0 0 8px #5fd6a8; }
  .hint { position: fixed; bottom: 10px; left: 12px; z-index: 10; color: #555; font-size: .72rem; }
</style>
</head>
<body>
<div id="scene"></div>
<div class="hud">
  <h1>piFly — orientation</h1>
  <div class="row"><span class="lbl">roll</span><span class="val" id="roll">--</span></div>
  <div class="row"><span class="lbl">pitch</span><span class="val" id="pitch">--</span></div>
  <div class="row"><span class="lbl">yaw</span><span class="val" id="yaw">--</span></div>
  <div class="row"><span class="lbl">alt (vs baseline)</span><span class="val" id="alt">--</span></div>
  <div class="row"><span class="lbl">offset from baseline</span><span class="val" id="off">--</span></div>
  <div class="row"><span class="lbl">pressure</span><span class="val" id="pres">--</span></div>
  <div class="row"><span class="lbl">temp</span><span class="val" id="temp">--</span></div>
</div>
<div class="status"><span class="dot" id="dot"></span><span id="status">waiting for data…</span></div>
<div class="hint">green ring = baseline · drag to orbit · scroll to zoom · right-drag to pan</div>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0e13);
scene.fog = new THREE.Fog(0x0e0e13, 40, 90);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
camera.position.set(9, 5, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.getElementById('scene').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0x8899aa, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(8, 14, 6);
scene.add(sun);

scene.add(new THREE.GridHelper(60, 60, 0x333344, 0x1c1c26));

const drone = new THREE.Group();
const matBody = new THREE.MeshStandardMaterial({ color: 0x9db8d2, roughness: 0.6 });
const matWing = new THREE.MeshStandardMaterial({ color: 0xe8a33d, roughness: 0.6 });
const matNose = new THREE.MeshStandardMaterial({ color: 0xd8554d, roughness: 0.5 });
const fuselage = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.22, 1.5), matBody);
const wing = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.05, 0.42), matWing);
wing.position.z = -0.1;
const tail = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 0.34), matWing);
tail.position.z = -0.62;
const fin = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.5, 0.34), matBody);
fin.position.set(0, 0.28, -0.62);
const nose = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.45, 16), matNose);
nose.rotation.x = Math.PI / 2;
nose.position.z = 0.95;
drone.add(fuselage, wing, tail, fin, nose);
scene.add(drone);

const TRAIL_MAX = 900;
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_MAX * 3), 3));
trailGeo.setDrawRange(0, 0);
const trail = new THREE.Line(trailGeo,
    new THREE.LineBasicMaterial({ color: 0x66ccff, transparent: true, opacity: 0.7 }));
scene.add(trail);

const BASELINE = new THREE.Vector3(0, 0, 0);

const baseRing = new THREE.Mesh(
    new THREE.TorusGeometry(0.9, 0.045, 8, 64),
    new THREE.MeshBasicMaterial({ color: 0x7ee6a8 }));
baseRing.rotation.x = Math.PI / 2;
baseRing.position.y = 0.02;
scene.add(baseRing);

const baseCross = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-1.4, 0.03, 0), new THREE.Vector3(1.4, 0.03, 0),
        new THREE.Vector3(0, 0.03, -1.4), new THREE.Vector3(0, 0.03, 1.4),
    ]),
    new THREE.LineBasicMaterial({ color: 0x7ee6a8, transparent: true, opacity: 0.8 }));
scene.add(baseCross);

const offsetGeo = new THREE.BufferGeometry().setFromPoints([BASELINE.clone(), BASELINE.clone()]);
const offsetLine = new THREE.Line(offsetGeo,
    new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.3, gapSize: 0.18,
                                   transparent: true, opacity: 0.55 }));
scene.add(offsetLine);

const $ = id => document.getElementById(id);

function setTrail(history) {
  const n = Math.min(history.length, TRAIL_MAX);
  const pos = trailGeo.attributes.position.array;
  for (let i = 0; i < n; i++) {
    pos[i * 3]     = history[i].x_m || 0;
    pos[i * 3 + 1] = history[i].alt_m || 0;
    pos[i * 3 + 2] = history[i].y_m || 0;
  }
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.setDrawRange(0, n);
}

async function poll() {
  try {
    const r = await fetch('/api/state?n=' + TRAIL_MAX, { cache: 'no-store' });
    const d = await r.json();
    if (!d.latest) {
      $('status').textContent = 'no data yet — is location.py running?';
      return;
    }
    $('dot').classList.add('on');
    $('status').textContent = 'live · ' + new Date(d.latest.timestamp * 1000).toLocaleTimeString();
    drone.quaternion.set(d.latest.qx, d.latest.qy, d.latest.qz, d.latest.qw);
    drone.position.set(d.latest.x_m || 0, d.latest.alt_m || 0, d.latest.y_m || 0);
    offsetGeo.setFromPoints([BASELINE, drone.position.clone()]);
    offsetGeo.attributes.position.needsUpdate = true;
    offsetLine.computeLineDistances();
    setTrail(d.history);
    $('roll').textContent = d.latest.roll.toFixed(1) + '°';
    $('pitch').textContent = d.latest.pitch.toFixed(1) + '°';
    $('yaw').textContent = d.latest.yaw.toFixed(1) + '°';
    $('alt').textContent = d.latest.alt_m.toFixed(1) + ' m';
    const dx = d.latest.x_m || 0, dy = d.latest.y_m || 0, dz = d.latest.alt_m || 0;
    $('off').textContent = Math.hypot(dx, dy, dz).toFixed(1) + ' m';
    $('pres').textContent = d.latest.pressure_hpa.toFixed(2) + ' hPa';
    $('temp').textContent = d.latest.temp_c.toFixed(1) + ' °C';
  } catch (e) {
    $('status').textContent = 'server unreachable';
    $('dot').classList.remove('on');
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

setInterval(poll, 250);
poll();

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
